<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Body</title>
</head>
<body>
        <!-- class = "wrapper" make website responsive -->
        <!-- Modal HTML -->
        <div id="myBox" 
        class="modal fade" 
        tabindex="-1" 
        role="dialog" 
        aria-labelledby="myBoxLabel" 
        aria-hidden="true">

       <div class="modal-dialog">
           <div class="modal-content">
               <div class="modal-header">
                   <h4 class="modal-title" id="myBoxLabel">
                       Modal Title
                   </h4>
                   <button type="button" 
                           class="close" 
                           data-dismiss="modal" 
                           aria-hidden="true">
                       &times;
                   </button>
               </div>
               <div class="modal-body">
                   <p>This is Modal Body</p>
               </div>
               <div class="modal-footer">
                   <button type="button" 
                           class="btn btn-default" 
                           data-dismiss="modal">
                       Close
                   </button>
               </div>
           </div>
       </div>
   </div>

   <!-- Button trigger modal -->
   <div class="text-center">
       <button type="button" 
               class="btn btn-primary" 
               data-toggle="modal" 
               data-target="#myBox">
           Click here to Launch Modal
       </button>
   </div>

   <!-- JavaScript -->
   <script>
       $(document).ready(function () {
           $('#myBox').on('show.bs.modal',
               function (event) {
                   $(this).data('bs.modal').
                       _config.backdrop = 'static';

                   $(this).data('bs.modal').
                       _config.keyboard = false;
               });
       });
   </script>

</body>
</html>
